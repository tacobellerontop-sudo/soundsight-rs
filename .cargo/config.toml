# Link the C runtime statically so SoundSight.exe runs on a clean Windows 10/11
# install without the Visual C++ Redistributable: one file, nothing to install.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
