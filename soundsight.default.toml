# SoundSight-RS configuration.
# Copied next to soundsight.exe as "soundsight.toml" on first run.
# Every key is optional; missing keys use the defaults shown here.
# Use "Reload config" in the tray menu after editing.

[general]
# Show/hide hotkey, registered with RegisterHotKey (no keyboard hook).
# Examples: "F10", "Ctrl+Shift+S", "Alt+F9", "Win+F8".
hotkey = "F10"
start_visible = true
# Upper bound on overlay redraws per second. Nothing is redrawn while nothing changes.
refresh_hz = 60
# Register the capture thread with MMCSS ("Games" task). Off by default: the
# capture thread already runs at ABOVE_NORMAL priority, and a dropped analysis
# block is harmless (we never play audio). Turn on only if you see stutter in the bars.
mmcss = false

[overlay]
# Bar thickness in physical pixels.
thickness = 6
# Bar length in pixels for the loudest sounds.
bar_length = 240
# Quietest visible sound gets this fraction of bar_length.
min_length_frac = 0.3
# Opacity (0..1) for the loudest sounds ...
opacity = 0.9
# ... and the quietest visible sound gets this fraction of it.
min_opacity_frac = 0.35
color = "#FF3B30"
# Faded bars below this intensity (0..1) are not drawn.
min_intensity = 0.04

[detection]
# Energy is measured over blocks of this many milliseconds.
block_ms = 10.0
# Band-pass (two biquads) to focus on footsteps / gunshots / reloads.
bandpass = true
band_low_hz = 200.0
band_high_hz = 4000.0
# Band energy in dBFS mapped to intensity 0 and 1 (loudness / closeness estimate).
min_db = -60.0
max_db = -18.0
# A block must be this many dB above the adaptive noise floor to show.
snr_db = 6.0
# Noise floor follows rising levels slowly (constant sounds fade out over a few seconds) ...
floor_rise_s = 3.0
# ... and falling levels quickly.
floor_fall_s = 0.3
# Bars fade out with this time constant (ms). Higher = less flicker, longer trails.
decay_ms = 250.0

[heuristics]
# Simple, imperfect suppression of sounds that are probably your own (footsteps,
# gun) or music. Disable if it hides sounds you care about.
enabled = true
# Ignore blocks where the centre channel has more than this share of the energy (surround only).
max_center_ratio = 0.6
# Ignore blocks with no clear direction (0 = diffuse/centred, 1 = single speaker).
min_focus = 0.15

[speakers]
# Speaker angles in degrees from straight ahead; left speakers use the negative value.
front = 30.0
side = 90.0
back = 150.0
# Angle of the single surround pair in 5.1 / quad layouts.
surround_pair = 110.0
# Angle used for plain stereo L/R.
stereo = 90.0
